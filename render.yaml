services:
  - type: web
    name: scp-dashboard
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: STAFF_LOGIN_PASSWORD
        sync: false
