<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SCP Foundation Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('dashboard') }}">
      <span class="brand-mark">&#9711;</span>
      <span class="brand-text">SECURE. CONTAIN. PROTECT.</span>
    </a>
    <nav class="site-nav">
      <a href="{{ url_for('archives') }}">Archives</a>
      <a href="{{ url_for('staff') }}">Staff</a>
      <a href="{{ url_for('communications') }}">Communications</a>
      <a href="{{ url_for('print_hub') }}">Print</a>
    </nav>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span>CLASSIFIED // LEVEL 3 CLEARANCE REQUIRED</span>
  </footer>
</body>
</html>
